# cargo-deny policy for the CARVED wallet-SDK workspace (sdk/Cargo.lock).
# Run: cargo deny --manifest-path sdk/Cargo.toml check
#
# WHY a SECOND deny file: the root `deny.toml` only scans the root Cargo.lock,
# and the root workspace `exclude`s `sdk/` (gate-0 — the ZEC derivation stack's
# pre-release `digest` cannot share the main lock). So the entire funds-path
# crypto graph (orchard, halo2_*, sapling-crypto, pasta_curves, bls12_381,
# secp256k1, zcash_*, bip32, bip39) resolves ONLY here and is invisible to the
# root deny run. Without this file the NU6.2 counterfeiting floor below is
# documentation, not a gate (crypto audit + security review + arch review,
# W3-inc-2).
#
# THE OWED WIRING IS DONE, and this note records where it went rather than being
# deleted. `lefthook.yml`'s `cargo-deny` lane got a BLOCKING sdk leg at P0-6
# — in `pre-push`, which `.push-gate` means nothing ever calls. `just
# sdk-audit` got it at P0-7, and THAT is the invocation with a caller that
# runs on its own: the launchd nightly reaches it through `just sdk-gate`.
# `just ci` and ci.yml's `supply-chain` job call the same recipe.
#
# cargo-deny IS installed on the dev host and has run against this file (0.20.2,
# `advisories ok, bans ok, licenses ok, sources ok`), so the
# [licenses] allow set is validated by use. What is still OWED is narrower than
# the sentence that used to sit here: the two hash-0 clarify placeholders below
# are inert until someone pastes the reported hashes — their own item (§4g of
# docs/plan/production-readiness-phase-0.md), not this file's supply-chain gate.
# The [bans] floors are correct regardless and are the load-bearing protection.

[advisories]
version = 2
yanked = "deny"   # a yanked pre-release on the funds path MUST fail loudly
# No ignores: the libcrux dev-dep advisories the root file carries are NOT in
# this graph (they live in the MLS/identity crates, which the SDK never depends
# on — ADR-0013 extraction invariant).

[licenses]
version = 2
# Same MIT/Apache store-flavor policy as root (ADR-0007); GPL/AGPL via a Cargo
# dep is forbidden. The wallet crypto stack is permissively licensed
# (MIT/Apache/BSD class); validate the exact set on the first `cargo deny` run.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unlicense",
  "MPL-2.0",            # file-level copyleft, MIT-app-compatible (mirrors root)
  "CDLA-Permissive-2.0",
  "Zlib",
  "CC0-1.0",
]
confidence-threshold = 0.9

# ring + allo-isolate: same SPDX-matcher papercuts the root file documents (a
# concatenated LICENSE / a license-file-only manifest). hash = 0 placeholder —
# `cargo deny check licenses` reports the real value on first run; paste it then.
[[licenses.clarify]]
name = "ring"
expression = "Apache-2.0 AND ISC AND MIT"
license-files = [{ path = "LICENSE", hash = 0 }]

[[licenses.clarify]]
name = "allo-isolate"
expression = "Apache-2.0"
license-files = [{ path = "LICENSE", hash = 0 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# OUR OWN PATH DEPS ARE NOT A SUPPLY-CHAIN SURFACE, AND THIS LINE IS WHY THE
# GATE CAN BE BLOCKING AT ALL (P0-6). `wildcards = "deny"` alone reports
# THREE `error[wildcard]`s against four in-tree path dependencies —
# `zec-wallet-core → apple-secure-enclave`, `zec-wallet-swap-near →
# zec-wallet-core`, and `zec_wallet →` both of them. They carry no `version`
# field because this workspace is VENDORED, not published (ADR-0541), so
# cargo-deny reads the absent requirement as `*`. That is a different category
# from an advisory: no `[advisories] ignore` touches it, and dropping
# lefthook's `|| true` without this line would have made every push in this
# repository fail on four `{ path = "../…" }` lines that are correct.
#
# WHAT IT COSTS, STATED RATHER THAN IMPLIED. A `*` requirement on a REGISTRY
# dependency is still denied — this only exempts `path` deps, i.e. crates that
# resolve to a directory inside this checkout, where "which version do I get"
# has one answer and the registry cannot supply another. What is lost: if one
# of these four crates is ever published, `cargo publish` would need a
# `version` beside each `path` and cargo-deny will no longer be the thing that
# reminds us — the reminder becomes `cargo publish`'s own refusal. Re-check
# this line if ADR-0541's vendored-distribution decision is ever superseded.
#
# AND IT HAS A SECOND INPUT THAT LIVES IN THE MANIFESTS (P0-7 A4). This
# line only exempts a crate cargo-deny considers PRIVATE, and privacy is read off
# `publish = false` in the manifest of the crate that DECLARES the path dep.
# Three of the four members declare such a dep, and all three lines are
# load-bearing — measured by deleting each one in a sandbox copy: any one of them
# alone takes `cargo deny check bans` to FAILED with "allow-wildcard-paths is
# enabled, but does not apply to public crates". `apple-secure-enclave` is a leaf
# and declares no path dep, so its line (added) is uniformity, not
# load-bearing. A FIFTH member with a path dependency and no `publish = false`
# turns this check red, and so does deleting any of the three — in a lane that,
# before P0-7, nothing that runs on its own ever called.
allow-wildcard-paths = true
deny = [
  # Orchard counterfeiting circuit bug (halo2_gadgets ecc::chip::mul soundness;
  # disclosed 2026-06, fixed with the NU6.2 stack 2026-06-03; NO RUSTSEC ID yet,
  # so cargo-audit is BLIND to it — this floor is the only mechanical gate). The
  # wallet lock carries orchard 0.14.0 (≥ floor, the fixed version); the floor
  # catches a future `cargo update` regression below it. As of W3-inc-2b-ii-A the
  # wallet-DB stack (zcash_client_sqlite → zcash_client_backend → the full orchard
  # proving circuit) pulls halo2_gadgets 0.5.0 (≥ floor) — so this ban is now
  # LOAD-BEARING (it was inert at the inc-2a derivation-only lock, where the proving
  # gadgets were absent). halo2_poseidon rides alongside it (poseidon hash), not in
  # place of it.
  { name = "halo2_gadgets", version = "<0.5.0" },
  { name = "orchard", version = "<0.14.0" },
  # TLS provider discipline (mirrors root): the swap adapter's rustls tree is
  # ring-only by the 2026-06-10 gate — aws-lc would silently re-admit the C
  # BoringSSL fork the cross-compile gate rejected. A regression below the
  # rustls/rustls-webpki advisory floors re-opens fixed RustSec advisories.
  { name = "aws-lc-rs" },
  { name = "aws-lc-sys" },
  { name = "rustls", version = "<0.23.45" }, # RUSTSEC-2026-0285 (TLS 1.3 handshake across a key change, fixed 0.23.45; the 2026-09-14 nightly)
  { name = "rustls-webpki", version = "<0.103.13" },
]
# arti and its LGPL carve-out (`equix`/`hashx`) are NOT this lock's concern:
# `sdk/dialer-tor` is its own workspace (its manifest says why) with its own
# `deny.toml` carrying those bans, audited by the same `just sdk-audit` leg.

[sources]
unknown-registry = "deny"
unknown-git = "deny"
