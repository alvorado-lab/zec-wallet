name: zec_wallet_example
description: "Example app for the zec_wallet SDK — a ZEC (Zcash) wallet built on the Rust core: onboarding, balance, send/receive, sync, history, and key-custody. Keys never cross into Dart."
# The example app is bundled with the plugin — never published to pub.dev.
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  # i18n wired from day one (app-frame spec §8 gate 8): gen-l10n via
  # `generate: true` below; en-only until more locales land.
  flutter_localizations:
    sdk: flutter
  # `any` is INTENTIONAL (canonical Flutter i18n pattern):
  # flutter_localizations pins its own intl version; a caret here can make
  # the solve impossible after a Flutter upgrade. The lockfile keeps
  # builds deterministic.
  intl: any

  # The wallet feature's own dependencies (qr_flutter, flutter_zxing,
  # path_provider) arrive TRANSITIVELY via zec_wallet_ui — a host app never
  # declares them. The one host-side residue: flutter_zxing's native build
  # fails on NDK r28+ (upstream #225), so android/app/build.gradle.kts pins
  # NDK r27 (the package README carries the same note for hosts).
  # State management (flutter-patterns § State Management): hand-written
  # Notifiers only in the frame — riverpod_annotation/codegen joins when a
  # real feature needs it (app-frame spec §1). NOTE (supply-chain): the
  # lockfile resolves the transitive `riverpod` NEWER than this package
  # declares (workspace-peer resolution) and that pulls `uuid` into the
  # production tree — verified network-inert; flagged for the
  # supply-chain-auditor pass (wallet-log S5).
  flutter_riverpod: ^3.3.1
  # Navigation. `redirect` must stay fast (flutter-patterns § Gotchas).
  go_router: ^17.2.0
  # Rendering preferences ONLY (theme mode / text scale / AMOLED) — never
  # application data; "Rust owns all state" governs app data, not these
  # (app-frame spec §2.1).
  shared_preferences: ^2.5.5
  # Settings → Device log → "Share device log" (stage S5 `row`): the OS share
  # sheet, text only (maintainer, Q5). BSD-3-Clause, fluttercommunity
  # plus_plugins, no Android permission. Chosen to match the version Relim
  # reported shipping, so a combined host resolves one copy; nothing checks
  # that across the two repos, so re-read Relim's pin when either moves. The
  # platform interface is named only to tell which registered implementation
  # shares through a `mailto:` link (Linux, Windows before 10 RS5), where the
  # payload is capped.
  # DEFERRED, stated: on that mail-link path share_plus builds the URI, and it
  # is share_plus that percent-encodes the text into `body=`
  # (`Uri.encodeComponent`, read in 12.0.2), so a `&` or `?` in a log line
  # cannot add a header. This app does not re-check that. Re-read it when this
  # pin moves.
  share_plus: ^12.0.2
  share_plus_platform_interface: ^6.1.0

  # The zec_wallet SDK — Rust-core wallet behind a keys-never-in-Dart
  # boundary. The example is bundled with the plugin, so it depends on the
  # parent package by path. An ffiPlugin: Cargokit builds + bundles the Rust
  # core into device builds automatically; `flutter test` never builds native
  # code (the wallet providers run against a fake session, never RustLib.init).
  # A real app would instead depend on `zec_wallet: ^x.y.z` from pub.dev.
  zec_wallet:
    path: ../
  # The reusable wallet UI layer (extraction in progress — the example is its
  # reference consumer). Owns the WalletColors theme tokens, the lifecycle
  # seam, the shared address/QR widgets, and the BIP39 asset; the feature tree
  # follows in later phases.
  zec_wallet_ui:
    path: ../../zec_wallet_ui
  # The OPTIONAL native companion (Scenario C, #342): default Android
  # FLAG_SECURE + the iOS app-switcher cover + backup-exclusion with ZERO host
  # native code. Adopting it here IS the acceptance test — the example's
  # hand-written MainActivity/AppDelegate handlers are deleted; this plugin is
  # their canonical home (see zec_wallet_ui_platform/README.md).
  zec_wallet_ui_platform:
    path: ../../zec_wallet_ui_platform
  # The OPTIONAL Tor plugin (FR-5): arti in its own native library, registered
  # with the wallet as its transport. OFF unless the user turns on "Use the
  # built-in Tor plugin" in Settings → Appearance; with it off the plugin is
  # never initialised and the wallet opens exactly as before. Its native build
  # compiles arti, so a device build of this example takes longer.
  zec_wallet_tor:
    path: ../../zec_wallet_tor

# In-repo resolution: zec_wallet_ui names the SDK by version (what a pub.dev
# consumer sees); here the SDK is the parent directory. Never reaches a consumer.
dependency_overrides:
  zec_wallet:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Deterministic timer control for the bounded-await tests.
  fake_async: ^1.3.1
  # Drives the on-device gates in integration_test/ (bridge self-test +
  # custody round-trip). Never built by `flutter test` (host-VM unit tests).
  integration_test:
    sdk: flutter
  # TEST-ONLY (the FR-24 airplane-create gate resolves its THROWAWAY dir).
  # Deliberately not an app dependency — the doc posture above ("arrives
  # transitively via zec_wallet_ui; a host app never adds it") stays true.
  path_provider: ^2.1.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Drives `flutter gen-l10n` (config in l10n.yaml).
  generate: true

  # The BIP39 wordlist ships in `zec_wallet_ui` (addressed under
  # `packages/zec_wallet_ui/`). FONTS ARE THE HOST'S (FR-49 W-9, ADR-0564): the
  # SDK bundles none, so this app — the reference host — bundles the refreshed
  # design's three faces and hands them to `buildTheme(textTheme:)` and
  # `WalletTypography` (lib/core/theme/example_type.dart). All three are OFL
  # 1.1; each licence ships beside its files in assets/fonts/. Runtime font
  # fetching stays banned (privacy; works on censored networks).
  fonts:
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Onest-Bold.ttf
          weight: 700
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
